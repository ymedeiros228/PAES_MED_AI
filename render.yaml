# Render Blueprint — PAES MED AI
# Deploy unificado: backend FastAPI serve API + front Flutter web (build/web)
# Compativel com plano Free do Render (runtime: docker, sem disco persistente).
#
# Como usar:
#   1. Push este repo pro GitHub (privado)
#   2. Conecte no Render > New > Blueprint > selecione este repositorio
#   3. Configure as env vars com sync: false no Render dashboard:
#      - GEMINI_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY, OPENAI_API_KEY
#   4. Deploy
#
# O que acontece no deploy:
#   - Docker build: instala Python deps + compila Flutter web + gera banco
#   - Start: uvicorn serve API + front web no mesmo servidor
#   - Banco SQLite ja vem populado no image (build do Docker)

services:
  - type: web
    name: paes-med-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerContext: .
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: PAES_ALLOWED_ORIGINS
        sync: false
      - key: PAES_BOOTSTRAP_PROD
        value: "1"
