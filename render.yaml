# Render Blueprint — PAES MED AI
# Deploy unificado: backend FastAPI serve API + front Flutter web (build/web)
# Compativel com plano Free do Render (runtime: docker, sem disco persistente).
#
# Como usar:
#   1. Push este repo pro GitHub (privado)
#   2. Conecte no Render > New > Blueprint > selecione este repositorio
#   3. Configure env vars: GEMINI_API_KEY, GEMINI_MODEL
#   4. Deploy
#
# O que acontece no deploy:
#   - Docker build: instala Python deps + compila Flutter web + gera banco
#   - Start: uvicorn serve API + front web no mesmo servidor
#   - Banco SQLite ja vem populado no image (build do Docker)

services:
  - type: web
    name: paes-med-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerContext: .
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # configure manualmente no Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PAES_ALLOWED_ORIGINS
        sync: false  # URL do front se for deploy separado (Vercel)
